# Optional: runs PostgreSQL 16 in Docker, so you don't need to install it on Windows.
# Start:  docker compose up -d
# Stop:   docker compose down
# The data is kept in the "pgdata" volume.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: rentdb_v2
    # 5433 on the host, because a local Windows PostgreSQL already uses 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
